[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrlf-agent"
version = "0.1.0"
description = "High-speed code locator & surgical in-place editor for AI Coding Agents. Saves 90-95% context tokens."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "hungbui-ai" }
]
keywords = ["ai-agents", "mcp", "claude-code", "cursor", "token-optimization", "coding-agent", "ripgrep", "code-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ctrlf"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
ctrlf = "ctrlf.cli:main"
ctrlf-mcp = "ctrlf.mcp_server:main"

[project.urls]
Homepage = "https://github.com/hungbui-ai/ctrlf"
Repository = "https://github.com/hungbui-ai/ctrlf"
Issues = "https://github.com/hungbui-ai/ctrlf/issues"
